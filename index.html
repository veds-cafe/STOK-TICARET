  let currentPage=1;
  const itemsPerPage=48;
  let currentCategory='Tümü';
  let filteredData=[...productsData];
  let currentProduct=null;

  function initCategories(){
    const counts={};
    productsData.forEach(p=>counts[p.category]=(counts[p.category]||0)+1);
    const cats=['Tümü',...Object.keys(counts).sort()];
    document.getElementById('categories').innerHTML=cats.map((cat,i)=>`<button class="cat-btn ${i===0?'active':''}" onclick="filterCategory('${escapeJs(cat)}',this)">${escapeHtml(cat)}${cat==='Tümü'?'':` (${counts[cat]})`}</button>`).join('');
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function escapeJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

  function renderProducts(){
    const grid=document.getElementById('productGrid');
    grid.innerHTML='';
    const start=(currentPage-1)*itemsPerPage;
    const pageData=filteredData.slice(start,start+itemsPerPage);
    if(!pageData.length){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#888;padding:50px">Aradığınız kriterlere uygun ürün bulunamadı.</p>';document.getElementById('paginationBox').innerHTML='';updateStats();return;}
    pageData.forEach(item=>{
      const card=document.createElement('div');
      card.className='product-card';
      card.addEventListener('click',()=>openModal(item));
      card.innerHTML=`<div class="img-wrapper"><img src="${escapeHtml(item.img)}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.style.objectFit='contain';this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#f1f3f5"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#6c757d" font-family="Arial" font-size="24">Görsel Yok</text></svg>')}'"></div><div class="p-info"><div><div class="p-code">${escapeHtml(item.code)}</div><div class="p-title">${escapeHtml(item.title)}</div></div><div class="p-category">${escapeHtml(item.category)}</div></div>`;
      grid.appendChild(card);
    });
    renderPagination();updateStats();
  }

  function renderPagination(){
    const totalPages=Math.ceil(filteredData.length/itemsPerPage);const box=document.getElementById('paginationBox');box.innerHTML='';if(totalPages<=1)return;
    if(currentPage>1)box.innerHTML+=`<button class="page-btn" onclick="goToPage(${currentPage-1})"><i class="fa-solid fa-chevron-left"></i> Önceki</button>`;
    const start=Math.max(1,currentPage-2),end=Math.min(totalPages,currentPage+2);
    for(let i=start;i<=end;i++)box.innerHTML+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
    if(currentPage<totalPages)box.innerHTML+=`<button class="page-btn" onclick="goToPage(${currentPage+1})">Sonraki <i class="fa-solid fa-chevron-right"></i></button>`;
  }
  function goToPage(page){currentPage=page;renderProducts();window.scrollTo({top:250,behavior:'smooth'});}
  function updateStats(){const pages=Math.ceil(filteredData.length/itemsPerPage)||1;document.getElementById('totalCountText').innerText=`Toplam ${filteredData.length} ürün listeleniyor`;document.getElementById('pageInfoText').innerText=`Sayfa ${currentPage} / ${pages}`;}
  function filterCategory(cat,btn){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCategory=cat;applyFilters();}
  function onSearchChange(){applyFilters();}
  function applyFilters(){const q=document.getElementById('searchInput').value.trim().toLowerCase();filteredData=productsData.filter(p=>(currentCategory==='Tümü'||p.category===currentCategory)&&(`${p.title} ${p.code} ${p.category}`.toLowerCase().includes(q)));currentPage=1;renderProducts();}
  function openModal(product){currentProduct=product;document.getElementById('mTitle').innerText=product.title;document.getElementById('mCode').innerText=product.code;document.getElementById('mCategory').innerText=product.category;document.getElementById('mDesc').innerText=product.desc;document.getElementById('mImg').src=product.img;document.getElementById('productModal').classList.add('active');document.body.style.overflow='hidden';}
  function closeModal(){document.getElementById('productModal').classList.remove('active');document.body.style.overflow='';}
  function closeModalOutside(e){if(e.target.id==='productModal')closeModal();}
  function sendWhatsAppOrder(){if(!currentProduct)return;const text=`Merhaba, stok kataloğundan bilgi almak istiyorum.%0A%0AÜrün: ${encodeURIComponent(currentProduct.title)}%0AKod: ${encodeURIComponent(currentProduct.code)}`;window.open(`https://wa.me/905411400115?text=${text}`,'_blank');}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  initCategories();renderProducts();
</script>
